# Include this file inside a server { } block, and keep the include ABOVE
# your "location ~ \.php$" handler. nginx picks the FIRST matching regex
# location, so the deny rules below only win if they come first.

# Framework internals. nginx serves any file that exists on disk via
# try_files, so without these rules every source file under lf-* is
# downloadable -- lf-storage/keys/app.key above all. Covers every current
# and future lf-* directory.
location ~ ^/(lf-[a-z]+|vendor|docs)(/|$) {
    deny all;
}

# Dotfiles: .env, .git, .htaccess, .gitignore
location ~ /\. {
    deny all;
}

# Never execute anything uploaded. A .php dropped into uploads/ must be
# served as bytes at most, never handed to FastCGI.
location ~ ^/uploads/.*\.(php|phar|phtml|phps)$ {
    deny all;
}

# Sensitive files at the project root
location ~ ^/(composer\.(json|lock)|laika(\.bat)?|worker(\.bat)?|nginx\.conf|phpunit\.xml.*|phpcs\.xml)$ {
    deny all;
}

location / {
    # Handle Authorization Header
    if ($http_authorization != "") {
        set $auth_header $http_authorization;
    }

    try_files $uri /index.php$is_args$args;
}

